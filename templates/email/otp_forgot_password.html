{% extends "base.html" %}
{% block content %}
<p>Hi <strong>{{ name }}</strong>,</p>
<p>Use the OTP below to <strong>reset your password</strong>.</p>
<div class="otp-box">{{ otp }}</div>
<p class="expiry">Expires in {{ expiry }} minutes</p>
<p class="warning">⚠️ If you didn't request a password reset, secure your account immediately.</p>
{% endblock %}
